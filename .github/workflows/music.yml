name: MUSIC

on:
  workflow_dispatch:

jobs:
  secure-rdp:
    runs-on: windows-latest
    timeout-minutes: 360 # Maksimum limit runner GitHub Actions adalah 6 jam

    steps:
      - name: Configure Core MUSIC Settings
        shell: powershell
        run: |
          # Aktifkan RDP dan sesuaikan level autentikasi
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "SecurityLayer" -Value 0 -Force

          # Konfigurasi Firewall untuk Port 3389
          netsh advfirewall firewall delete rule name="RDP-Tailscale" 2>$null
          netsh advfirewall firewall add rule name="RDP-Tailscale" dir=in action=allow protocol=TCP localport=3389

          # Restart service Terminal Service
          Restart-Service -Name TermService -Force

      - name: Create MUSIC User with Secure Password
        shell: powershell
        run: |
          # Set karakter aman (menghindari tanda petik, backtick, dan dollar agar tidak bentrok dengan shell)
          $charsUpper   = [char[]](65..90)      # A-Z
          $charsLower   = [char[]](97..122)     # a-z
          $charsNumber  = [char[]](48..57)      # 0-9
          $charsSpecial = '!','@','#','%','*','-','_','=','+'

          $rawPass = @()
          $rawPass += $charsUpper | Get-Random -Count 4
          $rawPass += $charsLower | Get-Random -Count 4
          $rawPass += $charsNumber | Get-Random -Count 4
          $rawPass += $charsSpecial | Get-Random -Count 4
          $password = -join ($rawPass | Sort-Object { Get-Random })

          # Buat user lokal RDP
          $securePass = ConvertTo-SecureString $password -AsPlainText -Force
          New-LocalUser -Name "RDP" -Password $securePass -AccountNeverExpires
          Add-LocalGroupMember -Group "Administrators" -Member "RDP"
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member "RDP"

          # Tulis ke GITHUB_ENV dengan encoding UTF-8
          "RDP_PASSWORD=$password" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "User 'RDP' berhasil dibuat."

      - name: Install Tailscale
        shell: powershell
        run: |
          $tsUrl = "https://pkgs.tailscale.com/stable/tailscale-setup-1.82.0-amd64.msi"
          $installerPath = "$env:TEMP\tailscale.msi"

          Write-Host "Mengunduh Tailscale..."
          Invoke-WebRequest -Uri $tsUrl -OutFile $installerPath
          Start-Process msiexec.exe -ArgumentList "/i", "`"$installerPath`"", "/quiet", "/norestart" -Wait
          Remove-Item $installerPath -Force -ErrorAction SilentlyContinue

          # Tunggu service Tailscale siap
          Start-Sleep -Seconds 5

      - name: Establish Tailscale Connection
        shell: powershell
        env:
          TS_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TS_KEY)) {
              Write-Error "Secret 'TAILSCALE_AUTH_KEY' kosong atau belum ditambahkan ke repository GitHub Secrets!"
              exit 1
          }

          $tailscaleExe = "$env:ProgramFiles\Tailscale\tailscale.exe"
          
          # Hubungkan ke Tailscale
          & $tailscaleExe up --authkey=$env:TS_KEY --hostname="gh-runner-$env:GITHUB_RUN_ID" --accept-routes

          # Polling hingga mendapatkan IP Tailscale
          $tsIP = $null
          $retries = 0
          while (-not $tsIP -and $retries -lt 12) {
              $tsIP = & $tailscaleExe ip -4
              if ($tsIP) { break }
              Start-Sleep -Seconds 5
              $retries++
          }

          if (-not $tsIP) {
              Write-Error "Gagal mendapatkan IP Tailscale setelah beberapa kali percobaan."
              exit 1
          }

          "TAILSCALE_IP=$tsIP" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Tailscale terhubung dengan IP: $tsIP"

      - name: Verify MUSIC Accessibility
        shell: powershell
        run: |
          Write-Host "Menguji port RDP di IP: $env:TAILSCALE_IP"
          $testResult = Test-NetConnection -ComputerName $env:TAILSCALE_IP -Port 3389
          if (-not $testResult.TcpTestSucceeded) {
              Write-Error "Koneksi ke port RDP 3389 gagal!"
              exit 1
          }
          Write-Host "Port RDP 3389 berhasil diverifikasi dan terbuka!"

      - name: Maintain Connection
        shell: powershell
        run: |
          Write-Host "`n=========================================="
          Write-Host "             RDP CONNECTION INFO          "
          Write-Host "=========================================="
          Write-Host "IP Address : $env:TAILSCALE_IP"
          Write-Host "Port       : 3389"
          Write-Host "Username   : RDP"
          Write-Host "Password   : $env:RDP_PASSWORD"
          Write-Host "==========================================`n"

          # Loop agar runner tetap aktif sampai batas timeout tercapai
          while ($true) {
              Write-Host "[$(Get-Date -Format 'yyyy-MM-dd HH:mm:ss')] Runner aktif. Batalkan workflow di GitHub untuk menghentikan."
              Start-Sleep -Seconds 300
          }
